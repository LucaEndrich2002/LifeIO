name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:tooling
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - name: Start local database and apply migrations
        run: node scripts/start-test-database.mjs
      - run: pnpm test:integration
      - name: Rehearse an isolated logical database restore
        run: |
          docker pull public.ecr.aws/supabase/postgres:17.6.1.167
          pnpm test:restore
      - name: Upgrade fictional existing data through repository migrations
        run: pnpm test:migrations
      - name: Rehearse CLI migration failure and recovery with fictional data
        run: pnpm test:migrations:cli
      - run: pnpm test:auth
      - name: Prepare fictional material for the manual Home study
        run: pnpm test:home:prepare
      - name: Upload blank Home study kit
        uses: actions/upload-artifact@v7
        with:
          name: home-study-kit
          path: .cache/home-study/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Stop test database
        if: ${{ always() }}
        run: pnpm exec supabase stop
      - name: Upload browser test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            playwright-auth-report/
            test-results-auth/
          if-no-files-found: ignore
          retention-days: 7

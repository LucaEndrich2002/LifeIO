# Local development only; cloud settings must be configured independently.
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "lifeos"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

# Add fictional fixtures with the first real schema migration.
[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Captures local development mail; no external mail delivery.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Development inbox only; no external delivery. Allows the complete local test suite.
[auth.rate_limit]
email_sent = 100

[auth.email.template.confirmation]
subject = "Bestätige dein LifeOS-Konto"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Dein Code für ein neues LifeOS-Passwort"
content_path = "./supabase/templates/recovery.html"

[realtime]
enabled = false

[storage]
enabled = false

[storage.vector]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
